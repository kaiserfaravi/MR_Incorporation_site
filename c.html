<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <title>External SVG Captcha</title>
  <style>
    body {
      font-family: sans-serif;
      text-align: center;
      margin: 40px;
    }

    object {
      border: 1px solid #ccc;
      margin: 20px auto;
      display: block;
    }

    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.6);
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .modal-content {
      background: white;
      padding: 20px;
      border-radius: 10px;
      width: 300px;
      text-align: center;
    }

    .captcha-box {
      display: flex;
      justify-content: space-around;
      align-items: center;
      margin-top: 20px;
    }

    #draggable {
      width: 60px;
      height: 60px;
      background: #2980b9;
      border-radius: 50%;
      cursor: grab;
    }

    #dropzone {
      width: 80px;
      height: 80px;
      border: 3px dashed #555;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 14px;
    }

    #dropzone.success {
      background: #d4edda;
      border-color: green;
    }

    #proceed {
      margin-top: 20px;
      padding: 10px 20px;
      background: gray;
      color: white;
      border: none;
      border-radius: 5px;
      pointer-events: none;
    }

    #proceed.active {
      background: #27ae60;
      pointer-events: auto;
    }

    .close-btn {
      float: right;
      cursor: pointer;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <h2>Click an Email Box (SVG)</h2>
  <object id="svgObject" data="links.svg" type="image/svg+xml" width="500" height="100"></object>

  <!-- CAPTCHA Modal -->
  <div class="modal" id="captchaModal">
    <div class="modal-content">
      <span class="close-btn" onclick="closeModal()">✖</span>
      <h4>🧩 Drag the Circle into the Box</h4>
      <div class="captcha-box">
        <div id="draggable" draggable="true"></div>
        <div id="dropzone">Drop here</div>
      </div>
      <button id="proceed">Proceed to Email</button>
    </div>
  </div>

  <script>
    let selectedMailto = null;

    // When SVG is loaded
    document.getElementById("svgObject").addEventListener("load", function () {
      const svgDoc = this.contentDocument;
      const anchors = svgDoc.querySelectorAll("a");

      anchors.forEach(anchor => {
        anchor.addEventListener("click", function (e) {
          e.preventDefault();
          selectedMailto = anchor.getAttribute("data-email");
          document.getElementById("captchaModal").style.display = "flex";
        });
      });
    });

    function closeModal() {
      document.getElementById("captchaModal").style.display = "none";
      location.reload();
    }

    // Drag & Drop CAPTCHA logic
    const draggable = document.getElementById("draggable");
    const dropzone = document.getElementById("dropzone");
    const proceed = document.getElementById("proceed");

    draggable.addEventListener("dragstart", e => {
      e.dataTransfer.setData("text/plain", "dragged");
    });

    dropzone.addEventListener("dragover", e => {
      e.preventDefault();
    });

    dropzone.addEventListener("drop", e => {
      e.preventDefault();
      if (e.dataTransfer.getData("text/plain") === "dragged") {
        dropzone.classList.add("success");
        dropzone.innerText = "✅ Done";
        proceed.classList.add("active");
      }
    });

    proceed.addEventListener("click", () => {
      if (selectedMailto) {
        window.location.href = selectedMailto;
      }
    });
  </script>

</body>
</html>
